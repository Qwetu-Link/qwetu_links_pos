openapi: 3.0.3
info:
  title: 'Qwetu Link POS API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Endpoints
    description: ''
paths:
  /api/user:
    get:
      summary: ''
      operationId: getApiUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/products:
    get:
      summary: 'Display a listing of the resource.'
      operationId: displayAListingOfTheResource
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  links:
                    first: 'http://localhost/api/v1/products?page=1'
                    last: 'http://localhost/api/v1/products?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: null
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: 'http://localhost/api/v1/products?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: 'http://localhost/api/v1/products'
                    per_page: 5
                    to: null
                    total: 0
                properties:
                  data:
                    type: array
                    example: []
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost/api/v1/products?page=1'
                      last:
                        type: string
                        example: 'http://localhost/api/v1/products?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: string
                        example: null
                        nullable: true
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          -
                            url: 'http://localhost/api/v1/products?page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://localhost/api/v1/products'
                      per_page:
                        type: integer
                        example: 5
                      to:
                        type: string
                        example: null
                        nullable: true
                      total:
                        type: integer
                        example: 0
      tags:
        - Endpoints
      security: []
    post:
      summary: 'Store a newly created resource in storage.'
      operationId: storeANewlyCreatedResourceInStorage
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                category_id:
                  type: string
                  description: ''
                  example: consequatur
                brand:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: mqeopfuudtdsufvyvddqa
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Dolores dolorum amet iste laborum eius est dolor.'
                  nullable: true
                image_url:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'http://reynolds.com/'
                  nullable: true
                is_available:
                  type: boolean
                  description: ''
                  example: false
                color:
                  type: array
                  description: 'Must not be greater than 50 characters.'
                  example:
                    - sufvyvddqamniihfqcoyn
                  items:
                    type: string
                    nullable: true
                size:
                  type: array
                  description: 'Must not be greater than 20 characters.'
                  example:
                    - lazghdtqtqxbajwbp
                  items:
                    type: string
                    nullable: true
                buy_price:
                  type: array
                  description: 'Must be at least 0.'
                  example:
                    - 31
                  items:
                    type: number
                instock:
                  type: array
                  description: 'Must be at least 0.'
                  example:
                    - 41
                  items:
                    type: number
                sell_price:
                  type: array
                  description: 'Must be at least 0.'
                  example:
                    - 55
                  items:
                    type: number
                product_id:
                  type: array
                  description: 'The <code>id</code> of an existing record in the product_catalogs table.'
                  example:
                    - consequatur
                  items:
                    type: string
              required:
                - name
                - category_id
                - is_available
                - buy_price
                - instock
                - sell_price
                - product_id
      security: []
  '/api/v1/products/{id}':
    get:
      summary: 'Display the specified resource.'
      operationId: displayTheSpecifiedResource
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      security: []
    put:
      summary: 'Update the specified resource in storage.'
      operationId: updateTheSpecifiedResourceInStorage
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    delete:
      summary: 'Remove the specified resource from storage.'
      operationId: removeTheSpecifiedResourceFromStorage
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the product.'
        example: consequatur
        required: true
        schema:
          type: string
